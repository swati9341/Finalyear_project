<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Simple rendered ER diagram (static SVG) for quick viewing -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <style>
    .box { fill:#f9f9f9; stroke:#333; stroke-width:1.2 }
    .title { font: bold 14px sans-serif }
    .field { font: 12px monospace }
    .rel { font: 12px sans-serif; fill:#333 }
  </style>

  <!-- user -->
  <rect class="box" x="20" y="20" width="200" height="110" rx="6"/>
  <text class="title" x="30" y="40">user</text>
  <text class="field" x="30" y="60">id (PK)</text>
  <text class="field" x="30" y="76">name</text>
  <text class="field" x="30" y="92">email</text>
  <text class="field" x="30" y="108">phone</text>
  <text class="field" x="30" y="124">password_hash</text>

  <!-- invoice -->
  <rect class="box" x="260" y="20" width="340" height="140" rx="6"/>
  <text class="title" x="270" y="40">invoice</text>
  <text class="field" x="270" y="60">id (PK)</text>
  <text class="field" x="270" y="76">invoice_number</text>
  <text class="field" x="270" y="92">user_id (FK)</text>
  <text class="field" x="270" y="108">customer_name, customer_email</text>
  <text class="field" x="270" y="124">customer_phone, subtotal</text>
  <text class="field" x="270" y="140">tax, total, pdf_path</text>

  <!-- invoice_item -->
  <rect class="box" x="260" y="180" width="340" height="100" rx="6"/>
  <text class="title" x="270" y="200">invoice_item</text>
  <text class="field" x="270" y="220">id (PK)</text>
  <text class="field" x="270" y="236">invoice_id (FK)</text>
  <text class="field" x="270" y="252">description, quantity, price</text>

  <!-- relations -->
  <line x1="220" y1="75" x2="260" y2="75" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)" />
  <text class="rel" x="230" y="65">1</text>
  <text class="rel" x="250" y="65">*</text>

  <line x1="430" y1="160" x2="430" y2="180" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)" />
  <text class="rel" x="410" y="170">1</text>
  <text class="rel" x="440" y="170">*</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#333" />
    </marker>
  </defs>

</svg>
