<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Simple rendered ER diagram (static SVG) for quick viewing -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <style>
    .box { fill:#f9f9f9; stroke:#333; stroke-width:1.2 }
    .title { font: bold 14px sans-serif }
    .field { font: 12px monospace }
    .rel { font: 12px sans-serif; fill:#333 }
  </style>

  <!-- user -->
  <rect class="box" x="20" y="20" width="200" height="90" rx="6"/>
  <text class="title" x="30" y="40">user</text>
  <text class="field" x="30" y="60">id (PK)</text>
  <text class="field" x="30" y="76">email</text>
  <text class="field" x="30" y="92">password_hash</text>

  <!-- customer -->
  <rect class="box" x="260" y="20" width="220" height="90" rx="6"/>
  <text class="title" x="270" y="40">customer</text>
  <text class="field" x="270" y="60">id (PK)</text>
  <text class="field" x="270" y="76">name</text>
  <text class="field" x="270" y="92">email</text>

  <!-- invoice -->
  <rect class="box" x="520" y="20" width="340" height="120" rx="6"/>
  <text class="title" x="530" y="40">invoice</text>
  <text class="field" x="530" y="60">id (PK)</text>
  <text class="field" x="530" y="76">invoice_number</text>
  <text class="field" x="530" y="92">customer_id (FK)</text>
  <text class="field" x="530" y="108">subtotal, tax, total</text>
  <text class="field" x="530" y="124">pdf_path, created_at</text>

  <!-- invoice_item -->
  <rect class="box" x="520" y="160" width="340" height="100" rx="6"/>
  <text class="title" x="530" y="180">invoice_item</text>
  <text class="field" x="530" y="200">id (PK)</text>
  <text class="field" x="530" y="216">invoice_id (FK)</text>
  <text class="field" x="530" y="232">description, quantity, price</text>

  <!-- relations -->
  <line x1="380" y1="65" x2="520" y2="65" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)" />
  <text class="rel" x="410" y="55">1</text>
  <text class="rel" x="490" y="55">*</text>

  <line x1="680" y1="140" x2="680" y2="160" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)" />
  <text class="rel" x="660" y="150">1</text>
  <text class="rel" x="690" y="150">*</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#333" />
    </marker>
  </defs>

</svg>
